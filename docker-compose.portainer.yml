# Stack do wklejenia w Portainer (Stacks → Add stack → Web editor)
# po zaimportowaniu obrazu z release/trenazer-<wersja>.tar (Images → Import).
services:
  trenazer:
    image: trenazer:latest
    container_name: trenazer
    restart: unless-stopped
    # Sieć hosta: aplikacja słucha bezpośrednio na porcie 3000 NAS, a ogłoszenia mDNS
    # (trenazer.local) docierają do sieci lokalnej; w sieci mostkowej multicast nie przechodzi.
    network_mode: host
    environment:
      PORT: "3000"
      MDNS_HOSTNAME: trenazer.local
      # adres NAS w sieci lokalnej; powinien być stały (rezerwacja DHCP albo statyczny IP)
      MDNS_IP: 192.168.0.158
    volumes:
      # zmień na swój udział, np. /volume1/docker/trenazer/data
      - /volume1/docker/trenazer/data:/data
